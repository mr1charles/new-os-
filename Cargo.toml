[workspace]
resolver = "2"
members = ["services/syslib", "services/assistantd", "services/appkit", "services/spacesd", "services/opener", "apps/settings/src-tauri", "apps/calculator/src-tauri", "apps/notes/src-tauri", "apps/terminal/src-tauri", "apps/files/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/mr1charles/new-os-"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
