[package]
name = "newos-spacesd"
description = "NewOS Dual Space service: which space a password opens, and creating and removing spaces. Runs as root on the system D-Bus (org.newos.Spaces1)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "newos-spacesd"
path = "src/main.rs"

[features]
default = ["pam"]
# Real password checks through libpam. Without it (tests, CI without libpam headers) only the
# mock authenticator exists.
pam = ["dep:pam-client"]

[dependencies]
newos-syslib = { path = "../syslib" }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
zbus = { workspace = true }
clap = { version = "4", features = ["derive"] }
libc = "0.2"
pam-client = { version = "0.5", optional = true }

[dev-dependencies]
tempfile = "3"
