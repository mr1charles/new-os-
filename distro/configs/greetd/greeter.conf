# The Hyprland session greetd runs for the login screen (/usr/share/helixos/hypr/greeter.conf).
# It shows only shell/greeter.ts, and exits once the greeter hands the login to greetd, so
# greetd can start the chosen space's session.

monitor = , preferred, auto, auto

input {
    kb_layout = us
    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
}

ecosystem {
    no_donation_nag = true
    no_update_news = true
}

animations {
    enabled = false
}

# No keybindings: nothing to launch from the login screen.
exec-once = sh -c 'ags run --gtk 4 /usr/share/helixos/shell/greeter.ts; hyprctl dispatch exit'
