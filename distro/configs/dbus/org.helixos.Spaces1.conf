<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- HelixOS Dual Space service. Only root may own the name. Anyone may send to it; the service
     itself checks who is asking (the greeter, space accounts, or polkit for changes). -->
<busconfig>
  <policy user="root">
    <allow own="org.helixos.Spaces1"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.helixos.Spaces1"/>
  </policy>
</busconfig>
