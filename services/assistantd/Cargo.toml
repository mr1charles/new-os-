[package]
name = "helixos-assistantd"
description = "The HelixOS assistant: routes requests to Claude (cloud) or Ollama (on-device), runs tools, remembers conversations, and serves a local API for the shell and apps."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "helixos-assistantd"
path = "src/main.rs"

[dependencies]
helixos-syslib = { path = "../syslib" }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
axum = "0.8"
reqwest = { version = "0.13", features = ["json", "stream"] }
futures = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
rusqlite = { version = "0.40", features = ["bundled"] }
toml = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
walkdir = "2"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
