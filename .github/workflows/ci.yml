name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript (tokens, SDK, UI kit, shell, apps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:tokens
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test

  rust:
    name: Rust (services, app backends)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Tauri app backends link WebKitGTK and GTK 3; spacesd links libpam (bindings need libclang)
      # and its D-Bus test starts a private dbus-daemon.
      - name: Install system libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev libpam0g-dev libclang-dev dbus
      # rust-toolchain.toml pins the compiler so new clippy lints never break CI unannounced.
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  scripts:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: shellcheck scripts/*.sh services/*/tests/*.sh
