# The installed HelixOS session. greetd starts Hyprland with this file (milestone 8 installs
# it to /usr/share/helixos/hypr/session.conf; see distro/).

monitor = , preferred, auto, auto

env = XCURSOR_SIZE, 24
env = QT_QPA_PLATFORM, wayland;xcb
env = QT_QPA_PLATFORMTHEME, gtk3
env = ELECTRON_OZONE_PLATFORM_HINT, auto

source = /usr/share/helixos/hypr/helixos.conf

exec-once = dbus-update-activation-environment --systemd --all
exec-once = systemctl --user start helixos-session.target
# Flatpak apps' desktop entries, so they show in Launchpad and open from the shell.
exec-once = sh -c 'XDG_DATA_DIRS="$HOME/.local/share/flatpak/exports/share:/var/lib/flatpak/exports/share:${XDG_DATA_DIRS:-/usr/local/share:/usr/share}" exec ags run --gtk 4 /usr/share/helixos/shell/app.ts'
exec-once = hypridle
exec-once = hyprpm reload -n

# Window layout and style from Settings (written by the shell; the installer seeds it with
# floating windows).
source = ~/.config/helixos/hyprland-windows.conf

# Input and display choices from the Settings app (created empty by the installer; Settings
# rewrites it), then the user's own overrides, which win.
source = ~/.config/helixos/hyprland-settings.conf
source = ~/.config/helixos/hyprland-user.conf
