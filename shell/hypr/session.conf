# The installed NewOS session. greetd starts Hyprland with this file (milestone 8 installs
# it to /usr/share/newos/hypr/session.conf; see distro/).

monitor = , preferred, auto, auto

env = XCURSOR_SIZE, 24
env = QT_QPA_PLATFORM, wayland;xcb
env = QT_QPA_PLATFORMTHEME, gtk3
env = ELECTRON_OZONE_PLATFORM_HINT, auto

source = /usr/share/newos/hypr/newos.conf

exec-once = dbus-update-activation-environment --systemd --all
exec-once = systemctl --user start newos-session.target
exec-once = ags run --gtk 4 /usr/share/newos/shell/app.ts
exec-once = hypridle
exec-once = hyprpm reload -n

# Input and display choices from the Settings app (created empty by the installer; Settings
# rewrites it), then the user's own overrides, which win.
source = ~/.config/newos/hyprland-settings.conf
source = ~/.config/newos/hyprland-user.conf
