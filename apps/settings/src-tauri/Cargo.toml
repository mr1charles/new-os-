[package]
name = "helixos-settings"
description = "HelixOS Settings app backend: Tauri commands over helixos-syslib and helixos-appkit."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "helixos-settings"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
helixos-appkit = { path = "../../../services/appkit", features = ["tauri"] }
helixos-syslib = { path = "../../../services/syslib" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"

[dev-dependencies]
tauri = { version = "2", features = ["protocol-asset", "test"] }
tempfile = "3"
