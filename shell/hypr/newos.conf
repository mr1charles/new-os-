# NewOS look and feel for Hyprland: macOS-style floating windows, animations, blur for the
# shell's translucent surfaces, trackpad gestures, and the keyboard shortcuts.
#
# This file has no autostart. It is sourced by:
#   - session.conf            the installed NewOS session (starts the shell and services)
#   - scripts/dev-session.sh  a nested development session that runs the shell from the repo
#
# Written for Hyprland 0.56 (hyprlang rule syntax with match: props). User overrides belong in ~/.config/newos/hyprland-user.conf.

$shell = ags request -i newos

# ---------------------------------------------------------------------------------------------
# Look
# ---------------------------------------------------------------------------------------------
general {
    gaps_in = 6
    gaps_out = 12
    border_size = 0
    layout = dwindle
    resize_on_border = true
    extend_border_grab_area = 12
}

decoration {
    rounding = 12
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 34
        render_power = 3
        offset = 0 10
        color = rgba(00000059)
        color_inactive = rgba(00000033)
    }

    blur {
        enabled = true
        size = 12
        passes = 3
        noise = 0.02
        vibrancy = 0.2
        popups = true
        new_optimizations = true
    }
}

animations {
    enabled = true
    bezier = spring, 0.2, 0.9, 0.2, 1.05
    bezier = smooth, 0.25, 0.1, 0.25, 1.0
    bezier = snappy, 0.05, 0.7, 0.1, 1.0

    animation = windowsIn, 1, 5, spring, popin 85%
    animation = windowsOut, 1, 4, smooth, popin 90%
    animation = windowsMove, 1, 5, spring
    animation = fade, 1, 4, smooth
    animation = layersIn, 1, 4, snappy, fade
    animation = layersOut, 1, 3, smooth, fade
    animation = workspaces, 1, 5, spring, slide
    animation = specialWorkspace, 1, 5, spring, slidevert
}

dwindle {
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
    focus_on_activate = true
}

# No donation or release-notes windows: this is an OS session, not a Hyprland install.
ecosystem {
    no_donation_nag = true
    no_update_news = true
}

# ---------------------------------------------------------------------------------------------
# Input: natural scrolling and tap-to-click like a MacBook trackpad
# ---------------------------------------------------------------------------------------------
input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = true
        tap-to-click = true
        clickfinger_behavior = true
        disable_while_typing = true
        scroll_factor = 0.6
    }
}

# Three-finger swipe moves between desktops (Hyprland 0.51 gesture syntax).
gesture = 3, horizontal, workspace

# ---------------------------------------------------------------------------------------------
# Windows float by default, like macOS. Tiling is one shortcut away (Super+T).
# ---------------------------------------------------------------------------------------------
windowrule = float on, match:class .*
windowrule = center on, match:float true
windowrule = float on, pin on, match:title ^(Picture-in-Picture)$

# Blur behind the shell's translucent layers (namespaces are set in shell/widgets/*).
layerrule = blur on, ignore_alpha 0.1, match:namespace ^newos-(bar|dock|launcher|control-center|notification-center|assistant|app-switcher)$
layerrule = no_anim on, match:namespace ^newos-(wallpaper|island)$

# ---------------------------------------------------------------------------------------------
# Keyboard shortcuts. Super plays the role of the Command key.
# ---------------------------------------------------------------------------------------------
$mod = SUPER

# Shell
bind = $mod, SPACE, exec, $shell assistant
bind = $mod, A, exec, $shell launcher
bind = $mod SHIFT, A, exec, $shell launchpad
bind = $mod, TAB, exec, $shell switcher next
bind = $mod SHIFT, TAB, exec, $shell switcher prev
bind = $mod, N, exec, $shell notifications
bind = $mod SHIFT, C, exec, $shell control-center
bind = $mod, COMMA, exec, newos-settings
bind = $mod, L, exec, loginctl lock-session

# Windows
bind = $mod, Q, killactive
bind = $mod, W, killactive
bind = $mod, M, movetoworkspacesilent, special:minimized
bind = $mod SHIFT, M, togglespecialworkspace, minimized
bind = $mod, H, movetoworkspacesilent, special:hidden
bind = CTRL $mod, F, fullscreen, 0
bind = $mod, T, togglefloating
bind = $mod, P, pin

# Apps
bind = $mod, RETURN, exec, sh -c 'command -v newos-terminal >/dev/null && exec newos-terminal || exec kitty'
bind = $mod, E, exec, sh -c 'command -v newos-files >/dev/null && exec newos-files || exec nautilus'

# Desktops (Spaces inside a login space): Ctrl+arrows like macOS, Super+number to jump
bind = CTRL, LEFT, workspace, m-1
bind = CTRL, RIGHT, workspace, m+1
# Mission Control needs the hyprexpo plugin. Going through hyprctl keeps the config valid (no
# error banner) on machines where the plugin is not loaded yet.
bind = CTRL, UP, exec, hyprctl dispatch hyprexpo:expo toggle
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4

# Screenshots: Super+Shift+3 full screen, Super+Shift+4 region (saved to ~/Pictures/Screenshots)
bind = $mod SHIFT, 3, exec, sh -c 'mkdir -p ~/Pictures/Screenshots && grim ~/Pictures/Screenshots/"Screenshot $(date +%F\ at\ %H.%M.%S).png" && notify-send -i camera-photo-symbolic "Screenshot saved"'
bind = $mod SHIFT, 4, exec, sh -c 'mkdir -p ~/Pictures/Screenshots && grim -g "$(slurp)" ~/Pictures/Screenshots/"Screenshot $(date +%F\ at\ %H.%M.%S).png" && notify-send -i camera-photo-symbolic "Screenshot saved"'
bind = , PRINT, exec, sh -c 'grim -g "$(slurp)" - | wl-copy && notify-send -i camera-photo-symbolic "Screenshot copied"'

# Mouse: Super+drag moves, Super+right-drag resizes
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Hardware keys go through the shell so changes show in the Dynamic Island
bindel = , XF86AudioRaiseVolume, exec, $shell volume up
bindel = , XF86AudioLowerVolume, exec, $shell volume down
bindl = , XF86AudioMute, exec, $shell volume mute
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp, exec, $shell brightness up
bindel = , XF86MonBrightnessDown, exec, $shell brightness down
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous
